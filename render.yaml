services:
  # 1. FastAPI Python Backend
  - type: web
    name: agrismart-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # 2. Vite React Frontend
  - type: web
    name: agrismart-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # If the frontend eventually needs to talk to the backend, it will use environment variables
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
